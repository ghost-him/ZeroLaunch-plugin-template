[plugin]
id = "com.example.hello-world"
name = "Hello World 插件"
version = "0.1.0"
description = "一个简单的 ZeroLaunch 第三方插件示例"
author = "Your Name <you@example.com>"
# 插件形态：inline = 触发词路由（行内）；panel = 候选项/热键唤醒（接管搜索窗口）
mode = "inline"
# 全局唤醒快捷键（仅 panel 形态注册，如 "Ctrl+E"）
# hotkey = "Ctrl+E"
# 触发关键词：inline 形态下即路由触发词，panel 形态下作为默认候选项的匹配关键字
triggerKeywords = ["hello", "hw"]
supportedOs = ["windows"]
priority = 100

[runtime]
command = "bin/zerolaunch-hello-world-plugin.exe"
args = []
startupTimeout = 10
autoRestart = true
maxRestart = 3

[components]
provides = ["plugin"]

[ui]
panelEntry = "ui/panel.mjs"

[icon]
# 插件图标文件（相对插件目录；仅 panel 形态在界面展示）
path = "icon.svg"
